name: Build and Release Figma Plugin

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required to upload release assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create plugin zip
        run: |
          cd build
          zip -r ../dsai-import-tokens-v${{ steps.get_version.outputs.VERSION }}.zip dsai-import-tokens
          cd ..

      - name: Generate checksums
        run: |
          sha256sum dsai-import-tokens-v${{ steps.get_version.outputs.VERSION }}.zip > checksums.txt

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: DSAi Import Tokens v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## DSAi Import Tokens Plugin v${{ steps.get_version.outputs.VERSION }}

            ### 🚀 Installation

            1. Download `dsai-import-tokens-v${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract the zip file
            3. In Figma Desktop: **Plugins → Development → Import plugin from manifest**
            4. Select the `manifest.json` file from the extracted folder

            ### 📦 What's Included

            - Full plugin source code (built and ready to use)
            - TypeScript compiled to JavaScript
            - UI HTML and all assets
            - Manifest file

            ### ✅ Verified Build

            This release was automatically built and tested by GitHub Actions.

            **Checksums:**
            ```
            See checksums.txt for SHA256 verification
            ```

            ### 📚 Documentation

            - [Installation Guide](../blob/main/README.md)
            - [Feature Documentation](../tree/main/docs)

            ---

            **Note:** This plugin requires Figma Desktop app. It will not work in the browser.
          draft: false
          prerelease: false

      - name: Upload Release Asset (ZIP)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dsai-import-tokens-v${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: dsai-import-tokens-v${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload Checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./checksums.txt
          asset_name: checksums.txt
          asset_content_type: text/plain

      - name: Build Success Notification
        if: success()
        run: |
          echo "✅ Build successful!"
          echo "📦 Plugin version v${{ steps.get_version.outputs.VERSION }} is ready"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Build Failure Notification
        if: failure()
        run: |
          echo "❌ Build failed!"
          echo "Please check the logs above for errors"
          exit 1

